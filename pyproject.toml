[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sweeper"
version = "0.1.0"
description = "A data sweeping engine: collect and cleanse modes over one core"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sweeper = "sweeper.cli:main"

[tool.setuptools]
packages = ["sweeper", "sweeper.connectors", "sweeper.collect", "sweeper.cleanse"]

[tool.setuptools.package-data]
sweeper = ["schema_sqlite.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
